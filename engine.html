<style>
/* One-screen garage: the car fills the screen, title top-left, tabbed dock at the bottom. Single dark look on purpose (a night garage). */
:root {
  --bg: #121016;
  --panel: rgba(24, 20, 30, 0.82);
  --line: #3a3244;
  --fg: #f1ece4;
  --muted: #a89fb2;
  --accent: #ffb636;
  --display: "Bungee", "Impact", sans-serif;
  --body: "Barlow Condensed", "Arial Narrow", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.top { position: fixed; top: 0; left: 0; right: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 14px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; display: flex; flex-direction: column; gap: 2px; }
.top h1 { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 6vw, 34px); margin: 0; letter-spacing: 0.02em; line-height: 1; text-wrap: balance; }
.top h1 span { color: var(--accent); }
.top p { margin: 0; color: var(--muted); font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); padding-top: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: linear-gradient(to top, var(--bg) 40%, transparent); display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; width: 52px; flex: none; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.btn { font-family: var(--body); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.btn:disabled { opacity: 0.4; cursor: default; }
.panel { display: flex; flex-direction: column; gap: 8px; min-height: 40px; justify-content: center; }
.panel.row { flex-direction: row; }
.panel[hidden] { display: none; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); padding-top: 6px; }
.tab { font-family: var(--body); font-weight: 700; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; background: none; border: 0; color: var(--muted); padding: 8px 0; cursor: pointer; border-bottom: 2px solid transparent; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }
#panel-paint .row { gap: 6px; flex-wrap: nowrap; }
#panel-paint .sw { width: 30px; height: 30px; flex: none; }
#panel-paint .btn { padding: 5px 8px; font-size: 14px; }
.row.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.row.scroll::-webkit-scrollbar { display: none; }
.row.scroll .btn { flex: none; white-space: nowrap; padding: 5px 8px; font-size: 14px; }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.sw:focus-visible, .btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
#err[hidden] { display: none; }
#err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); font-size: 18px; }
#info { margin-top: 6px; color: var(--fg); font-size: 16px; letter-spacing: 0.02em; text-transform: none; max-width: 640px; }
#gain { color: var(--accent); }
.bad { color: #ff7a6b; }
.note { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.25; letter-spacing: 0.02em; }
.tabs { grid-template-columns: repeat(6, 1fr); }
.label { width: 60px; }
#dyno { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(16px, env(safe-area-inset-right, 0px)); width: 330px; height: 180px; border: 1px solid var(--line); border-radius: 10px; pointer-events: none; }

@media (max-width: 720px) {
  #dyno { top: calc(env(safe-area-inset-top, 0px) + 150px); left: 16px; right: auto; width: calc(100% - 32px); height: 120px; }
  .tab { font-size: 13px; letter-spacing: 0.02em; }
  #info { font-size: 15px; }
}

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  if (!window.THREE) { document.getElementById('err').hidden = false; return; }
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x121016);
  scene.fog = new THREE.Fog(0x121016, 9, 22);

  // Reflections: a dyno cell (dark room, bright softboxes, one warm panel)
  // baked into an environment map so stainless has something to mirror.
  (function () {
    const room = new THREE.Scene();
    room.add(new THREE.Mesh(new THREE.BoxGeometry(20, 10, 20), new THREE.MeshBasicMaterial({ color: 0x2a2630, side: THREE.BackSide })));
    const panel = (w, h, c, k, x, y, z, ry, rx) => {
      const m = new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }); m.color.multiplyScalar(k);
      const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m); p.position.set(x, y, z); p.rotation.set(rx || 0, ry || 0, 0); room.add(p);
    };
    panel(10, 2, 0xffffff, 3, 0, 4.9, 0, 0, Math.PI / 2);
    panel(6, 3, 0xffffff, 2, 9.9, 2, 0, -Math.PI / 2);
    panel(6, 3, 0xffd2a0, 1.6, -9.9, 2, 3, Math.PI / 2);
    panel(8, 1, 0xcfe0ff, 1.4, 0, 1, -9.9, 0);
    panel(20, 20, 0x4a4250, 1, 0, -4.9, 0, 0, -Math.PI / 2);
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(room, 0.03).texture;
  })();

  const HOME = new THREE.Vector3(2.5, 1.7, 2.3), HOME_T = new THREE.Vector3(0, 0.75, -0.3);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 60);
  camera.position.copy(HOME);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.copy(HOME_T);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 0.6;
  controls.maxDistance = 7;
  controls.maxPolarAngle = Math.PI * 0.62;
  controls.autoRotate = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  controls.autoRotateSpeed = 1.1;
  controls.addEventListener('start', () => { controls.autoRotate = false; });

  // Light: warm key, cool fill, orange rim from behind.
  const hemi = new THREE.HemisphereLight(0xb8c4ff, 0x2a2018, 0.55);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(0xfff1dc, 1.25);
  key.position.set(4, 7, 3);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  Object.assign(key.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -2.5, near: 1, far: 16 });
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xff9a3c, 0.4);
  rim.position.set(-5, 3, -4);
  scene.add(rim);
  const under = new THREE.PointLight(0xffe2c0, 0.5, 3); under.position.set(0, 0.25, 0.2); scene.add(under);
  // Heat light: an orange glow under the headers that rises with the heat.
  const heatL = [1, -1].map(s => { const l = new THREE.PointLight(0xff5a1a, 0, 1.6, 2); l.position.set(s * 0.55, 0.6, -0.2); scene.add(l); return l; });

  // Floor: sealed dyno-cell concrete with a yellow safety box round the cart.
  const floor = new THREE.Mesh(new THREE.CircleGeometry(12, 48), new THREE.MeshStandardMaterial({ color: 0x1d1b21, roughness: 0.9, envMapIntensity: 0.25 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  {
    const lm = new THREE.MeshStandardMaterial({ color: 0xd8c27a, roughness: 0.8 });
    const fl = (w, d, x, z) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), lm); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.004, z); scene.add(m); };
    fl(2.6, 0.07, 0, 1.2); fl(2.6, 0.07, 0, -2.4); fl(0.07, 3.67, 1.3, -0.6); fl(0.07, 3.67, -1.3, -0.6);
  }

  // ---------------------------------------------------------------------
  // Materials
  // ---------------------------------------------------------------------
  const std = (o) => new THREE.MeshStandardMaterial(o);
  const chrome = std({ color: 0xf2f4f8, metalness: 1, roughness: 0.1 });
  const steel = std({ color: 0x8a8d92, metalness: 0.9, roughness: 0.35 });
  const cast = std({ color: 0x3a3a3c, metalness: 0.5, roughness: 0.7 });
  const iron = std({ color: 0x2c2a28, metalness: 0.4, roughness: 0.85 });
  const black = std({ color: 0x0f0f11, roughness: 0.6, metalness: 0.2 });
  const rubber = std({ color: 0x141414, roughness: 0.9 });
  const cartMat = std({ color: 0x1d4fa8, metalness: 0.3, roughness: 0.45 });
  const boltMat = std({ color: 0x5a5c60, metalness: 0.9, roughness: 0.3 });
  const brass = std({ color: 0xc9a24a, metalness: 0.9, roughness: 0.3 });
  const blockMat = std({ color: 0x9a9ca0, metalness: 0.5, roughness: 0.5 });
  const coverMat = std({ color: 0x121214, metalness: 0.3, roughness: 0.4 });
  const intakeMat = std({ color: 0x18181a, metalness: 0.3, roughness: 0.5 });

  const add = (geo, mat, x, y, z, parent) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x || 0, y || 0, z || 0);
    m.castShadow = true; m.receiveShadow = true;
    parent.add(m); return m;
  };
  const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  const cylZ = (r1, r2, len, seg) => new THREE.CylinderGeometry(r1, r2, len, seg || 24).rotateX(Math.PI / 2);
  const cylX = (r1, r2, len, seg) => new THREE.CylinderGeometry(r1, r2, len, seg || 24).rotateZ(Math.PI / 2);
  // Rounded box: a rounded rectangle in x-y pushed out along z.
  const rbox = (w, h, d, r) => {
    const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    const g = new THREE.ExtrudeGeometry(s, { depth: d - 2 * r * 0.5, bevelEnabled: true, bevelSize: r * 0.5, bevelThickness: r * 0.5, bevelSegments: 3, curveSegments: 6 });
    g.translate(0, 0, -(d - r) / 2);
    return g;
  };
  const label = (text, w, h, fg, bg, font) => {
    const c = document.createElement('canvas'); c.width = 512; c.height = Math.round(512 * h / w);
    const x = c.getContext('2d');
    if (bg) { x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height); }
    x.fillStyle = fg; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = font || ('bold ' + Math.round(c.height * 0.62) + 'px Impact, Arial');
    x.fillText(text, c.width / 2, c.height / 2 + 2, c.width * 0.92);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
    return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: t, transparent: !bg, roughness: 0.5, metalness: 0.2 }));
  };

  // Tube sweep: like TubeGeometry but the radius can change along the
  // length (flared ports, stepped primaries, collector cones), and uv.x
  // runs from u0 at the port to u1 so heat colour and glow follow the pipe.
  function sweep(curve, rFn, N, R, u0, u1) {
    const fr = curve.computeFrenetFrames(N, false), pos = [], nor = [], uv = [], idx = [];
    const P = new THREE.Vector3(), n = new THREE.Vector3();
    for (let i = 0; i <= N; i++) {
      const t = i / N; curve.getPointAt(t, P); const r = rFn(t), Nn = fr.normals[i], Bn = fr.binormals[i];
      for (let j = 0; j <= R; j++) {
        const v = j / R * Math.PI * 2, sn = Math.sin(v), cs = -Math.cos(v);
        n.set(cs * Nn.x + sn * Bn.x, cs * Nn.y + sn * Bn.y, cs * Nn.z + sn * Bn.z).normalize();
        pos.push(P.x + r * n.x, P.y + r * n.y, P.z + r * n.z); nor.push(n.x, n.y, n.z);
        uv.push(u0 + (u1 - u0) * t, j / R);
      }
    }
    for (let i = 1; i <= N; i++) for (let j = 1; j <= R; j++) {
      const a = (R + 1) * (i - 1) + (j - 1), b = (R + 1) * i + (j - 1), c = (R + 1) * i + j, d = (R + 1) * (i - 1) + j;
      idx.push(a, b, d, b, c, d);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx);
    return g;
  }
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const path = (pts, tension) => new THREE.CatmullRomCurve3(pts, false, 'centripetal', tension);
  class Helix extends THREE.Curve {
    constructor(a, b, r, turns) { super(); this.a = a; this.b = b; this.r = r; this.turns = turns; this.ax = b.clone().sub(a); this.len = this.ax.length(); this.ax.normalize(); this.u = new THREE.Vector3(0, 1, 0).cross(this.ax).normalize(); if (this.u.lengthSq() < 0.1) this.u.set(1, 0, 0); this.w = this.ax.clone().cross(this.u); }
    getPoint(t, out) { out = out || new THREE.Vector3(); const k = t * this.turns * Math.PI * 2; return out.copy(this.a).addScaledVector(this.ax, t * this.len).addScaledVector(this.u, Math.cos(k) * this.r).addScaledVector(this.w, Math.sin(k) * this.r); }
  }

  // Heat maps along the pipe (uv.x): the burnt rainbow stainless gets when
  // it has been run hard, and the glow that is brightest at the ports.
  const gradTex = (stops) => {
    const c = document.createElement('canvas'); c.width = 256; c.height = 4; const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 256, 0); stops.forEach(([p, col]) => g.addColorStop(p, col));
    x.fillStyle = g; x.fillRect(0, 0, 256, 4);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
  };
  const RAINBOW = gradTex([[0, '#c89a52'], [0.08, '#8a4a7a'], [0.18, '#3b4f9c'], [0.3, '#5d86b8'], [0.42, '#c9a35c'], [0.56, '#d8c08c'], [0.72, '#cfc8bc'], [1, '#d2d0cc']]);
  const HEATMAP = (() => {
    const c = document.createElement('canvas'); c.width = 256; c.height = 4; const x = c.getContext('2d');
    for (let i = 0; i < 256; i++) { const v = Math.round(255 * Math.exp(-i / 256 * 4)); x.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')'; x.fillRect(i, 0, 1, 4); }
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
  })();

  // ---------------------------------------------------------------------
  // Catalogue. Brand names as text only, no logos. Prices are for the
  // header set; pipes are priced on their own. Sizes are tube OD.
  // ---------------------------------------------------------------------
  const IN = 0.0254;
  const FINISH = {
    polished: { label: 'Polished stainless', c: 0xe9e9ec, m: 1, r: 0.1, glow: 1 },
    raw: { label: 'Raw stainless', c: 0xc6c3bd, m: 1, r: 0.28, glow: 1 },
    burnt: { label: 'Burnt rainbow', c: 0xffffff, m: 1, r: 0.22, glow: 1, map: RAINBOW },
    csilver: { label: 'Ceramic silver', c: 0xb9bcbf, m: 0.7, r: 0.42, glow: 0.35 },
    ctitan: { label: 'Ceramic titanium', c: 0x6c6a66, m: 0.75, r: 0.36, glow: 0.35 },
    cblack: { label: 'Ceramic black', c: 0x1c1c1e, m: 0.35, r: 0.5, glow: 0.35 },
    paint: { label: 'Painted black', c: 0x0e0e10, m: 0.15, r: 0.7, glow: 0.7 },
  };

  const QS = new URLSearchParams(location.search), GAME = QS.get('game') === '1';
  const mwCfg = () => ({ engKey, brandKey, finKey, pipeKey, powKey, lvl, fuelKey, tunerKey, intK: Object.assign({}, intK) });
  function mwSet(c) {
    setEngine(c.engKey); setPower(c.powKey); lvl = c.lvl; setBrand(c.brandKey); setFinish(c.finKey); setPipes(c.pipeKey);
    fuelKey = c.fuelKey; tunerKey = c.tunerKey; Object.assign(intK, c.intK); rebuildAll();
  }
  // what the game needs to make it sound like this build: firing pitch, how open the exhaust is, cam lope, blower or turbo
  function mwSnd() { const P = powerDef(); return { base: E.base, o: (isTurbo() ? 0.75 : 1) * (brandKey === 'stock' && !isTurbo() ? 0.05 : PIPES[pipeKey].open), cam: intK.cam !== 'stock', type: P.type, red: E.red }; }
  function mwBake() {
    engineRoot.position.y = CRANK_Y; engineRoot.rotation.set(0, 0, 0); engineRoot.updateMatrixWorld(true);
    const inv = new THREE.Matrix4().copy(engineRoot.matrixWorld).invert(), mats = [], parts = {}, box = new THREE.Box3(), v = new THREE.Vector3(), n = new THREE.Vector3();
    const hex = c => '#' + c.getHexString();
    [engine, headers].forEach(root => root && root.traverse(o => {
      if (!o.isMesh) return; for (let q = o; q; q = q.parent) if (!q.visible) return;
      const ml = Array.isArray(o.material) ? o.material : [o.material], g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry, pos = g.attributes.position, nor = g.attributes.normal;
      const M = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld), N = new THREE.Matrix3().getNormalMatrix(M), flip = M.determinant() < 0;
      const groups = g.groups && g.groups.length && Array.isArray(o.material) ? g.groups : [{ start: 0, count: pos.count, materialIndex: 0 }];
      for (const gr of groups) {
        const mat = ml[gr.materialIndex || 0]; if (!mat || mat.visible === false) continue;
        let k = mats.indexOf(mat); if (k < 0) { mats.push(mat); k = mats.length - 1; }
        const a = parts[k] || (parts[k] = { p: [], n: [] });
        for (let t = gr.start; t + 2 < gr.start + gr.count; t += 3) for (const i of flip ? [t, t + 2, t + 1] : [t, t + 1, t + 2]) {
          v.fromBufferAttribute(pos, i).applyMatrix4(M); a.p.push(v.x, v.y, v.z); box.expandByPoint(v);
          if (nor) { n.fromBufferAttribute(nor, i).applyMatrix3(N).normalize(); a.n.push(n.x, n.y, n.z); } else a.n.push(0, 1, 0);
        }
      }
    }));
    return { mats: mats.map(m => ({ c: hex(m.color || new THREE.Color(1, 1, 1)), e: m.emissive && m.emissiveIntensity ? hex(m.emissive.clone().multiplyScalar(Math.min(1, m.emissiveIntensity))) : '#000000', mt: m.metalness ?? 0, r: m.roughness ?? 1, o: m.opacity, t: !!m.transparent, f: !!m.flatShading, d: m.side === THREE.DoubleSide, basic: !m.isMeshStandardMaterial })),
      parts: Object.entries(parts).map(([k, a]) => ({ m: +k, p: new Float32Array(a.p), n: new Float32Array(a.n) })), box: [box.min.toArray(), box.max.toArray()] };
  }
  window.__mw = { cfg: mwCfg, set: mwSet, snd: mwSnd, bake: mwBake };
  if (GAME) {
    document.body.classList.add('mw');
    // your car joins the Swap tab, with the shop's rate on the kit
    const rate = +QS.get('rate') || 1;
    SWAPS.unshift({ key: 'mine', label: 'Your ' + (QS.get('car') || 'car'), stock: QS.get('stock') || 'stock motor', hp: +QS.get('hp') || 300, kg: +QS.get('kg') || 1600, engKg: 230, kit: 'Swap mounts, harness, trans and driveshaft', price: Math.round(3400 * rate / 50) * 50, hours: 30 });
    swapKey = 'mine'; btn($('swaps'), 'mine', SWAPS[0].label, () => { swapKey = 'mine'; press('swaps', 'mine'); updateInfo(); }); $('swaps').prepend($('swaps').lastChild); press('swaps', 'mine');
    const total = () => cost().reduce((a, i) => a + i[1], 0) + SWAPS[0].price;
    const upd = updateInfo;
    updateInfo = function () {
      upd(); const c = calc(), b = $('mwInstall'), why = $('mwWhy');
      const bad = blown ? 'Rebuild it first.' : c.det ? 'Too much boost or spray for this fuel.' : c.peakHp > c.lim ? 'It will throw a rod. Build the inside.' : '';
      b.disabled = !!bad; b.textContent = 'Install · ' + money(total()); why.textContent = bad || fmt(c.peakHp) + ' hp in your car, kit included';
    };
    $('mwInstall').onclick = () => { const c = calc(); parent.postMessage({ mw: 'engine-install', cfg: mwCfg(), snd: mwSnd(), hp: Math.round(c.peakHp), label: E.label + (c.P.type === 'na' ? '' : ' · ' + c.P.label), total: total() }, '*'); };
    $('mwClose').onclick = () => parent.postMessage({ mw: 'engine-close' }, '*');
    if (QS.get('cfg')) try { mwSet(JSON.parse(QS.get('cfg'))); } catch (e) {}
    updateInfo();
  }
  window.__eng = { camera, controls, setBrand, setFinish, setPipes, setEngine, setPower, setPart, setCam, setDark, setXray, startEngine, rev, dyno, rebuild, calc,
    setLevel: (i) => { lvl = i; updateInfo(); }, setFuel: (k) => { fuelKey = k; press('fuels', k); updateInfo(); }, setSwap: (k) => { swapKey = k; updateInfo(); },
    heat: (h) => { heat = h; forceHeat = h; }, phi: (p) => { phi = p; poseAssembly(p); }, snap: () => { if (fly) { camera.position.copy(fly.pos); controls.target.copy(fly.tgt); fly = null; } } };

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(0.05, clock.getDelta());
    revT = Math.max(0, revT - dt * 1.2);
    if (pull > 0) pull = Math.max(0, pull - dt);
    if (pulling) {
      pullT = Math.min(1, pullT + dt / 4.6);
      const r = 2000 + (E.red - 2000) * pullT;
      if (sheet.blowAt && r >= sheet.blowAt) { pullT = (sheet.blowAt - 2000) / (E.red - 2000); drawDyno(pullT); blowUp(); }
      else { drawDyno(pullT); if (pullT >= 1) pulling = false; }
    }
    const load = pull > 1.4 ? Math.min(1, (6 - pull) / 4.6) : pull > 0 ? pull / 1.4 * 0.6 : 0;
    const want = forceHeat != null ? forceHeat : running ? 0.12 + revT * 0.25 + load * 0.95 : 0;
    heat += (want - heat) * Math.min(1, dt * (want > heat ? 0.9 : 0.25));
    glowMats.forEach(m => { m.emissiveIntensity = heat * heat * 2.4 * m.userData.glow; });
    heatL.forEach(l => { l.intensity = heat * heat * 0.4 * (tubeMat && brandKey !== 'stock' ? tubeMat.userData.glow : 0.5); });
    const amp = running ? 0.0015 + revT * 0.003 + load * 0.003 : 0;
    engineRoot.position.y = CRANK_Y + (amp ? (Math.random() - 0.5) * amp : 0);
    engineRoot.rotation.z = amp ? (Math.random() - 0.5) * amp * 2 + revT * 0.01 + load * 0.012 : 0;
    if (running && xray) { phi -= dt * Math.PI * 2 * (1.5 + revT * 4 + load * 5); poseAssembly(phi); }
    if (smokeLeft > 0) { smokeLeft -= dt; if (Math.random() < 0.5) puff(engineRoot.localToWorld(V(blown ? blown.s * 0.3 : 0, 0, 0)), 1); }
    for (let k = smoke.length - 1; k >= 0; k--) {
      const q = smoke[k]; q.life += dt; q.sp.position.addScaledVector(q.v, dt); q.sp.scale.setScalar(0.12 + q.life * 0.25);
      q.sp.material.opacity = 0.7 * (1 - q.life / q.max);
      if (q.life >= q.max) { scene.remove(q.sp); q.sp.material.dispose(); smoke.splice(k, 1); }
    }
    if (fly) {
      fly.t = Math.min(1, fly.t + 0.04);
      const e = fly.t * fly.t * (3 - 2 * fly.t);
      camera.position.lerp(fly.pos, e * 0.25);
      controls.target.lerp(fly.tgt, e * 0.25);
      if (fly.t >= 1 && camera.position.distanceTo(fly.pos) < 0.02) fly = null;
    }
    controls.update();
    renderer.render(scene, camera);
  });
})();
</script>
