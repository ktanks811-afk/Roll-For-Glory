<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Murda Worth Street Racing</title>
<meta name="description" content="Build your car. Build your name. A 2D open-world street racing life sim.">
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Murda Worth">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="screen-orientation" content="landscape">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/loading.webp" type="image/webp">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/touch.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="screen"></div>
  <div id="panels"></div>
  <div id="touch" class="hidden"></div>
  <div id="modals"></div>
  <div id="toasts"></div>
  <div id="boot" class="boot">
    <img class="boot-art" src="img/loading.webp" alt="Murda Worth Street Racing" fetchpriority="high" decoding="async">
    <div class="boot-bottom">
      <div class="boot-bar"><i id="boot-fill"></i></div>
      <div class="boot-msg" id="boot-msg">Loading Port Solace…</div>
    </div>
  </div>
  <noscript><div class="boot"><div class="boot-msg">Murda Worth Street Racing needs JavaScript turned on.</div></div></noscript>
  <script>
    // Ease the loading bar toward 90% while the game's modules download; boot() fills the rest.
    (function () {
      var f = document.getElementById('boot-fill'), w = 0;
      window.__bootTick = setInterval(function () { w += (90 - w) * 0.07; f.style.width = w + '%'; }, 100);
    })();
  </script>
  <script type="module" src="js/main.js"></script>
  <script>
    // Opening index.html straight off disk blocks ES modules. Say so instead
    // of sitting on "Loading…" forever.
    if (location.protocol === 'file:') {
      document.getElementById('boot-msg').innerHTML = 'This game has to be served over http(s).<br>Run <code>./serve.sh</code> (Mac/Linux) or <code>serve.cmd</code> (Windows), or play the GitHub Pages link.';
    }
    window.addEventListener('error', e => {
      const m = document.getElementById('boot-msg');
      if (m && document.getElementById('boot').style.display !== 'none') m.textContent = 'Failed to start: ' + (e.message || e);
    });
  </script>
</body>
</html>
